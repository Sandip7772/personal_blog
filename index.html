    <script>
        document.getElementById('year').textContent = new Date().getFullYear();

        var grid = document.getElementById('grid');
        var searchBox = document.getElementById('search');
        var allPosts = [];

        function fmt(value) {
            var d = new Date(value);
            if (isNaN(d.getTime())) { return ''; }
            return String(d.getDate()).padStart(2, '0') + '/' + String(d.getMonth() + 1).padStart(2, '0') + '/' + d.getFullYear();
        }
        function el(tag, cls, text) {
            var n = document.createElement(tag);
            if (cls) { n.className = cls; }
            if (text) { n.textContent = text; }
            return n;
        }
        function render(posts) {
            grid.textContent = '';
            if (!posts.length) { grid.appendChild(el('p', 'status', 'No posts found.')); return; }
            posts.forEach(function (p, i) {
                // The first card is wide only when that fills the 3-column rows evenly (2, 5, 8... posts)
                var featured = i === 0 && posts.length % 3 === 2;
                var card = el('article', 'card' + (featured ? ' featured' : ''));
                card.appendChild(el('div', 'card-top'));
                var body = el('div', 'card-body');
                var meta = el('div', 'meta');
                if (p.tag) { meta.appendChild(el('span', 'tag', p.tag)); }
                meta.appendChild(el('span', '', fmt(p.date)));
                body.appendChild(meta);
                var h = el('h2');
                var a = el('a', '', p.title);
                a.href = p.url;
                h.appendChild(a);
                body.appendChild(h);
                body.appendChild(el('p', '', p.excerpt || ''));
                var more = el('a', 'more', 'Read more →');
                more.href = p.url;
                body.appendChild(more);
                card.appendChild(body);
                grid.appendChild(card);
            });
        }

        fetch('posts.json').then(function (r) { return r.json(); }).then(function (posts) {
            allPosts = posts.sort(function (a, b) { return new Date(b.date) - new Date(a.date); });
            render(allPosts);
        }).catch(function () {
            grid.textContent = '';
            grid.appendChild(el('p', 'status', 'Could not load posts. Please try again later.'));
        });

        searchBox.addEventListener('input', function (e) {
            var q = e.target.value.trim().toLowerCase();
            render(allPosts.filter(function (p) {
                return (p.title + ' ' + (p.excerpt || '') + ' ' + (p.tag || '')).toLowerCase().indexOf(q) !== -1;
            }));
        });
    </script>
